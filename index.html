<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Детские игры</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; font-family: 'Nunito', system-ui, sans-serif; background: #fff6e9; color: #4a3426;
      display: flex; flex-direction: column; align-items: center; padding: 24px 16px; box-sizing: border-box; }
    h1 { font-weight: 900; font-size: 2rem; margin: 8px 0 20px; }
    .apps { display: grid; gap: 14px; width: 100%; max-width: 480px; }
    a { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 22px; padding: 16px; text-decoration: none; color: inherit;
      box-shadow: 0 6px 0 #ead6c1; }
    a:active { transform: translateY(4px); box-shadow: 0 2px 0 #ead6c1; }
    .ic { font-size: 2.8rem; }
    b { font-size: 1.3rem; display: block; }
    small { color: #8a7363; }
  </style>
</head>
<body>
  <h1>🎮 Детские игры</h1>
  <div class="apps">
    <a href="kotomatika/"><span class="ic">🐱</span><span><b>Котоматика</b><small>Таблица умножения с котиками</small></span></a>
  </div>
</body>
</html>
